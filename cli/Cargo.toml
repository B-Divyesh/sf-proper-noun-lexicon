[package]
name = "proper-noun-lexicon"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Private, reversible proper-noun corrections and speech-model phrase exports"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-proper-noun-lexicon"
keywords = ["transcription", "dictation", "whisper", "lexicon"]
categories = ["command-line-utilities", "text-processing"]
readme = "README.md"

[lib]
name = "proper_noun_lexicon"
path = "src/lib.rs"

[[bin]]
name = "pnl"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.15"
